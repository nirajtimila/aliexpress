<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliExpress Daily Coins Auto-Collector</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            500: '#ff4747',
                            600: '#e62e04',
                            700: '#c52200',
                        },
                        coin: {
                            light: '#ffd700',
                            DEFAULT: '#f59e0b',
                            dark: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-gold {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.35);
        }
        .glow-red {
            box-shadow: 0 0 25px -5px rgba(230, 46, 4, 0.4);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CoinIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="9" fill="#f59e0b" stroke="#d97706" />
                <path d="M12 7v10M9 9h4.5a1.5 1.5 0 0 1 0 3H10a1.5 1.5 0 0 0 0 3h4.5" stroke="#78350f" strokeWidth="2.2" />
            </svg>
        );

        const LightningIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <path d="M13 2L3 14h7v8l11-14h-8l1-6z"/>
            </svg>
        );

        const CheckCircleIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const RefreshIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const bookmarkletSnippet = `javascript:(function(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.setValueAtTime(880,ctx.currentTime);gain.gain.setValueAtTime(0.2,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2);osc.start();osc.stop(ctx.currentTime+0.2);}catch(e){}function smartClick(el){if(!el)return;const r=el.getBoundingClientRect();const opts={bubbles:true,cancelable:true,view:window,clientX:r.left+r.width/2,clientY:r.top+r.height/2};try{el.dispatchEvent(new PointerEvent('pointerdown',{...opts,pointerType:'touch'}));}catch(e){}try{el.dispatchEvent(new MouseEvent('mousedown',opts));}catch(e){}try{el.dispatchEvent(new PointerEvent('pointerup',{...opts,pointerType:'touch'}));}catch(e){}try{el.dispatchEvent(new MouseEvent('mouseup',opts));}catch(e){}try{el.dispatchEvent(new MouseEvent('click',opts));}catch(e){}el.click();if(el.parentElement&&el.parentElement!==document.body){try{el.parentElement.click();}catch(e){}}}const sBtn=document.getElementById('signButton');if(sBtn){smartClick(sBtn.closest('div')||sBtn);smartClick(sBtn);}const mCard=document.getElementById('sign-main-card');if(mCard){smartClick(mCard);}const all=Array.from(document.querySelectorAll('button,div,span,a,p'));const cTxt=all.find(el=>(el.innerText||'').trim().toLowerCase()==='collect'&&el.children.length===0);if(cTxt){smartClick(cTxt.closest('button,[role="button"],div')||cTxt);}if(window.webpackJsonp){try{window.webpackJsonp.push([['ae_auto_'+Date.now()],{},function(req){try{const m=req(240);if(m&&m.a){m.a({playCode:"productSignInCoinChannel",signTimeMills:Date.now(),asac:"2E2280406IM61M8MG1F2FB"});}}catch(e){}}]);}catch(e){}}const tBtns=all.filter(el=>/^\\+\\d+$/.test((el.innerText||'').trim())&&el.children.length===0);tBtns.forEach((b,i)=>{setTimeout(()=>{smartClick(b.closest('[role="button"],div,button')||b);},300+i*700);});setTimeout(()=>{const fresh=Array.from(document.querySelectorAll('div,span,p,a,button'));let coins=null,worth=null,streak=null,user=null;for(const el of fresh){const t=(el.innerText||'').trim();if(/^\\d{1,6}$/.test(t)&&el.children.length===0){const p=el.parentElement?el.parentElement.innerText:'';if(p.includes('worth')||p.includes('Coins helped')){coins=t;const wm=p.match(/worth\\s+([A-Z\\$0-9\\.]+)/i);if(wm)worth=wm[1];break;}}}const sEl=fresh.find(el=>(el.innerText||'').includes('streak')||((el.innerText||'').includes('Today')&&(el.innerText||'').includes('Worth')));if(sEl){streak=sEl.innerText.replace(/\\n+/g,' • ').trim();}const uEl=fresh.find(el=>(el.innerText||'').includes('Hi, ')||(el.innerText||'').includes('Welcome'));if(uEl){const um=uEl.innerText.match(/(?:Hi,\\s*|Welcome\\s+back,\\s*)([^\\s\\n\\.,]+)/i);if(um)user=um[1];}fetch('http://localhost:3333/api/connect_cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookies:document.cookie,username:user||'nirajtimilatube',coins:coins,worth:worth,streak:streak||'7-Day Streak Active',alreadyCollected:true})}).catch(e=>{});const old=document.getElementById('ae-collector-toast');if(old)old.remove();const toast=document.createElement('div');toast.id='ae-collector-toast';toast.style.cssText='position:fixed;top:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:16px 28px;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:15px;font-weight:700;z-index:2147483647;box-shadow:0 12px 35px rgba(0,0,0,0.45);text-align:center;border:2px solid #6ee7b7;animation:aeSlideDown 0.3s ease-out;';toast.innerHTML='🪙 DAILY COINS COLLECTED! 🎉<br><span style="font-size:20px;color:#fef08a;">Balance: '+(coins||'Updated')+' Coins</span> '+(worth?'<span style="font-size:13px;opacity:0.9;">('+worth+')</span>':'')+'<br><span style="font-size:11px;font-weight:400;opacity:0.9;margin-top:4px;display:inline-block;">✓ Synced live with Dashboard at localhost:3333</span>';const style=document.createElement('style');style.textContent='@keyframes aeSlideDown{from{transform:translate(-50%,-30px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}';document.head.appendChild(style);document.body.appendChild(toast);setTimeout(()=>{toast.style.transition='opacity 0.5s ease';toast.style.opacity='0';setTimeout(()=>toast.remove(),500);},5000);},1200);})();`;

        function App() {
            const [status, setStatus] = useState({
                isConnected: false,
                isBusy: false,
                loginWindowActive: false,
                currentAction: 'Idle',
                accountDetails: { email: null, userId: null, region: 'AU', currency: 'AUD', coins: null, worth: null, streak: null, lastCollected: null },
                lastResult: { status: 'Ready', message: '', coins: null, worth: null, timestamp: null },
                autoSchedule: true,
                logs: []
            });

            const [cookieInput, setCookieInput] = useState('');
            const [connectingCookie, setConnectingCookie] = useState(false);
            const [cookieMsg, setCookieMsg] = useState(null);
            const [activeTab, setActiveTab] = useState('virtual'); // Default to Virtual Browser Login
            const [isMobileActive, setIsMobileActive] = useState(false);
            const [copyStatus, setCopyStatus] = useState('Copy 1-Click Bookmarklet');
            const [editingCoins, setEditingCoins] = useState(false);
            const [inputCoins, setInputCoins] = useState('');
            const [history, setHistory] = useState([]);
            const [viewingRawLog, setViewingRawLog] = useState(false);
            const [rawLogText, setRawLogText] = useState('');
            const logContainerRef = useRef(null);

            // Interactive Virtual Browser Login State
            const [interactiveActive, setInteractiveActive] = useState(false);
            const [interactiveFrame, setInteractiveFrame] = useState(null);
            const [interactiveUrl, setInteractiveUrl] = useState('');
            const [interactiveLoggedIn, setInteractiveLoggedIn] = useState(false);
            const [interactiveStarting, setInteractiveStarting] = useState(false);
            const [typeInput, setTypeInput] = useState('');
            const [passInput, setPassInput] = useState('');
            const frameImgRef = useRef(null);
            const pollingTimerRef = useRef(null);

            const startInteractive = async (customUrl = null) => {
                setInteractiveStarting(true);
                setInteractiveLoggedIn(false);
                try {
                    const res = await fetch('/api/interactive/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: customUrl })
                    });
                    if (res.ok) {
                        setInteractiveActive(true);
                        startPollingFrames();
                    } else {
                        alert('Could not start interactive browser.');
                    }
                } catch(e) {
                    alert('Error: ' + e.message);
                } finally {
                    setInteractiveStarting(false);
                }
            };

            const stopInteractive = async () => {
                if (pollingTimerRef.current) clearInterval(pollingTimerRef.current);
                try {
                    await fetch('/api/interactive/stop', { method: 'POST' });
                } catch(e) {}
                setInteractiveActive(false);
                setInteractiveFrame(null);
                fetchStatus();
            };

            const startPollingFrames = () => {
                if (pollingTimerRef.current) clearInterval(pollingTimerRef.current);
                pollingTimerRef.current = setInterval(async () => {
                    try {
                        const res = await fetch('/api/interactive/frame');
                        if (res.ok) {
                            const data = await res.json();
                            if (data.active) {
                                if (data.frame) setInteractiveFrame(data.frame);
                                if (data.url) setInteractiveUrl(data.url);
                                if (data.loggedIn) {
                                    setInteractiveLoggedIn(true);
                                    setTimeout(() => {
                                        stopInteractive();
                                        fetchStatus();
                                    }, 3500);
                                }
                            } else if (!data.loggedIn) {
                                clearInterval(pollingTimerRef.current);
                                setInteractiveActive(false);
                            }
                        }
                    } catch(e) {}
                }, 200);
            };

            const sendInteractiveInput = async (payload) => {
                try {
                    await fetch('/api/interactive/input', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch(e) {}
            };

            const [dragStart, setDragStart] = useState(null);

            const getCanvasCoords = (e) => {
                if (!frameImgRef.current) return null;
                const img = frameImgRef.current;
                const rect = img.getBoundingClientRect();

                const imgAspect = 440 / 956;
                const elemAspect = rect.width / rect.height;

                let renderedWidth = rect.width;
                let renderedHeight = rect.height;
                let offsetX = 0;
                let offsetY = 0;

                if (elemAspect > imgAspect) {
                    renderedWidth = rect.height * imgAspect;
                    offsetX = (rect.width - renderedWidth) / 2;
                } else {
                    renderedHeight = rect.width / imgAspect;
                    offsetY = (rect.height - renderedHeight) / 2;
                }

                const clickX = e.clientX - rect.left - offsetX;
                const clickY = e.clientY - rect.top - offsetY;

                if (clickX < 0 || clickX > renderedWidth || clickY < 0 || clickY > renderedHeight) {
                    return null;
                }

                const scaleX = 440 / renderedWidth;
                const scaleY = 956 / renderedHeight;
                return {
                    x: Math.round(clickX * scaleX),
                    y: Math.round(clickY * scaleY)
                };
            };

            const handleMouseDown = (e) => {
                const coords = getCanvasCoords(e);
                if (coords) setDragStart(coords);
            };

            const handleMouseUp = (e) => {
                if (!dragStart) return;
                const coords = getCanvasCoords(e);
                if (coords) {
                    const dist = Math.hypot(coords.x - dragStart.x, coords.y - dragStart.y);
                    if (dist > 15) {
                        sendInteractiveInput({
                            action: 'drag',
                            startX: dragStart.x,
                            startY: dragStart.y,
                            endX: coords.x,
                            endY: coords.y
                        });
                    } else {
                        sendInteractiveInput({ action: 'click', x: coords.x, y: coords.y });
                    }
                }
                setDragStart(null);
            };

            const fetchHistory = async () => {
                try {
                    const res = await fetch('/api/history');
                    if (res.ok) {
                        const data = await res.json();
                        setHistory(data.history || []);
                    }
                } catch(e) {}
            };

            const handleViewRawLog = async () => {
                try {
                    const res = await fetch('/api/activity_log');
                    if (res.ok) {
                        const text = await res.text();
                        setRawLogText(text);
                        setViewingRawLog(true);
                    }
                } catch(e) {
                    alert('Could not load log: ' + e.message);
                }
            };

            const checkMobile = async () => {
                try {
                    const res = await fetch('/api/check_mobile');
                    if (res.ok) {
                        const data = await res.json();
                        setIsMobileActive(data.isMobileOpen);
                    }
                } catch(e) {}
            };

            const handleSaveCoins = async () => {
                if (!inputCoins.trim() || isNaN(inputCoins.trim())) {
                    alert('Please enter a valid number of coins.');
                    return;
                }
                try {
                    const res = await fetch('/api/update_balance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ coins: inputCoins.trim() })
                    });
                    if (res.ok) {
                        setEditingCoins(false);
                        setInputCoins('');
                        fetchStatus();
                    }
                } catch(e) {
                    alert('Update error: ' + e.message);
                }
            };

            const fetchStatus = async () => {
                try {
                    const res = await fetch('/api/status');
                    if (res.ok) {
                        const data = await res.json();
                        setStatus(data);
                    }
                } catch (e) {
                    console.error("Status fetch error", e);
                }
            };

            useEffect(() => {
                fetchStatus();
                checkMobile();
                fetchHistory();
                const interval = setInterval(() => {
                    fetchStatus();
                    checkMobile();
                    fetchHistory();
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (logContainerRef.current) {
                    logContainerRef.current.scrollTop = 0;
                }
            }, [status.logs]);

            const handleCollectNow = async () => {
                try {
                    await fetch('/api/collect', { method: 'POST' });
                    fetchStatus();
                } catch (e) {
                    alert('Error triggering collection: ' + e.message);
                }
            };

            const handleToggleSchedule = async () => {
                try {
                    await fetch('/api/toggle_schedule', { method: 'POST' });
                    fetchStatus();
                } catch (e) {}
            };

            const handleDisconnect = async () => {
                if (!confirm("Are you sure you want to disconnect this AliExpress account?")) return;
                try {
                    await fetch('/api/disconnect', { method: 'POST' });
                    fetchStatus();
                } catch (e) {}
            };

            // Open Exact Mobile Screen as a Pop-up directly in your local browser!
            const handleOpenPopup = () => {
                const url = 'https://m.aliexpress.com/p/coin-index/index.html?_immersiveMode=true&from=pc302';
                const popup = window.open(url, 'AliExpressMobile', 'width=440,height=956,left=250,top=40,menubar=no,toolbar=no,location=yes,status=no,resizable=yes');
                
                if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                    alert("⚠️ Pop-up Blocked by your browser!\n\nPlease check your browser address bar (top right) and click 'Always allow pop-ups for this site' so the mobile screen can open!");
                } else {
                    popup.focus();
                }

                // If on local Windows backend, also notify backend
                if (!status.isDocker) {
                    try { fetch('/api/open_native_mobile', { method: 'POST' }); } catch(e) {}
                }
            };

            const handleOpenNativeMobile = handleOpenPopup;

            // Force close all mobile session windows
            const handleCloseNativeMobile = async () => {
                try {
                    await fetch('/api/close_mobile', { method: 'POST' });
                    fetchStatus();
                } catch(e) {
                    alert('Close error: ' + e.message);
                }
            };

            // 1-Click Connect directly
            const handleConfirmLogin = async () => {
                try {
                    const res = await fetch('/api/confirm_login', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        fetchStatus();
                    }
                } catch(e) {}
            };

            // Direct in-browser popup: Detects when user clicks X (close button) to connect!
            const handleOpenInBrowserPopup = () => {
                const url = 'https://m.aliexpress.com/p/coin-index/index.html?_immersiveMode=true&from=pc302';
                const popup = window.open(url, 'AliExpressMobile', 'width=440,height=956,left=180,top=50,menubar=no,toolbar=no,location=yes,status=no,resizable=yes');
                setPopupOpen(true);

                const checkClosedInterval = setInterval(async () => {
                    if (!popup || popup.closed) {
                        clearInterval(checkClosedInterval);
                        setPopupOpen(false);
                        await handleConfirmLogin();
                    }
                }, 400);
            };

            const handleConnectCookie = async () => {
                if (!cookieInput.trim()) {
                    setCookieMsg({ type: 'error', text: 'Please paste your cookie string or JSON first!' });
                    return;
                }
                setConnectingCookie(true);
                setCookieMsg(null);
                try {
                    const res = await fetch('/api/connect_cookie', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cookieString: cookieInput.trim() })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setCookieMsg({ type: 'error', text: data.error || 'Failed to connect with provided cookies.' });
                    } else {
                        setCookieMsg({ type: 'success', text: `✓ Connected! Account: ${data.account?.email || data.account?.userId || 'User'}` });
                        setCookieInput('');
                        fetchStatus();
                    }
                } catch (e) {
                    setCookieMsg({ type: 'error', text: 'Connection failed: ' + e.message });
                } finally {
                    setConnectingCookie(false);
                }
            };

            const handleClearLogs = async () => {
                await fetch('/api/clear_logs', { method: 'POST' });
                fetchStatus();
            };

            const copyBookmarkletToClipboard = () => {
                navigator.clipboard.writeText(bookmarkletSnippet);
                setCopyStatus('Copied! Drag or Paste to Bookmarks Bar ✓');
                setTimeout(() => setCopyStatus('Copy 1-Click Bookmarklet'), 3000);
            };

            const acc = status.accountDetails || {};
            const isConnected = status.isConnected;
            const isBusy = status.isBusy;

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row items-start md:items-center justify-between pb-6 mb-8 border-b border-slate-800 gap-4">
                        <div className="flex items-center space-x-3.5">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center glow-red shadow-lg">
                                <CoinIcon className="w-7 h-7 text-white" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                                    AliExpress Coins Auto-Collector
                                    <span className="text-xs uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-slate-800 text-amber-400 border border-slate-700">PRO v2.5</span>
                                </h1>
                                <p className="text-xs text-slate-400">Dynamic Live Balance • Daily Streak Auto-Collect • Bonus Tasks (+1, +5)</p>
                            </div>
                        </div>

                        {/* Status Pill */}
                        <div className="flex items-center space-x-3">
                            <div className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-full text-xs font-semibold border ${
                                isConnected 
                                    ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300' 
                                    : 'bg-amber-950/60 border-amber-500/40 text-amber-300'
                            }`}>
                                <span className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                <span>{isConnected ? 'ACCOUNT CONNECTED' : 'NOT CONNECTED'}</span>
                            </div>

                            {isBusy && (
                                <div className="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-950/60 border border-blue-500/40 text-blue-300">
                                    <RefreshIcon className="w-3.5 h-3.5 animate-spin" />
                                    <span>{status.currentAction || 'Processing...'}</span>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Main Grid */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                        {/* Account & Coins Info Card (Spans 2 cols) */}
                        <div className="lg:col-span-2 glass-card rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between">
                            <div className="absolute -right-16 -top-16 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

                            <div>
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center space-x-2 text-xs font-semibold tracking-wider uppercase text-slate-400">
                                        <span>Live AliExpress Account Details (Dynamic Ready)</span>
                                    </div>
                                    {isConnected && (
                                        <button 
                                            onClick={handleDisconnect}
                                            className="text-xs text-rose-400 hover:text-rose-300 transition hover:underline">
                                            Disconnect Account
                                        </button>
                                    )}
                                </div>

                                {isConnected ? (
                                    <div className="space-y-5">
                                        {/* User Identity Badges */}
                                        <div className="flex flex-wrap items-center gap-2">
                                            <div className="px-3 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60 text-sm font-semibold text-white flex items-center gap-2">
                                                <span className="text-slate-400">User:</span>

                                    </div>
                                )}
                            </div>
                        )}

                        {/* Tab 1: Exact Mobile Screen (PRIMARY INTEGRATED) */}
                        {activeTab === 'mobile' && (
                            <div className="space-y-4">
                                <div className="p-4 rounded-xl bg-slate-900/90 border border-slate-800 space-y-3">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-xl">
                                                📱
                                            </div>
                                            <div>
                                                <div className="text-sm font-bold text-white flex items-center gap-2">
                                                    <span>iPhone 16 Pro Max Standalone Emulation</span>
                                                    {status.isDocker ? (
                                                        <span className="px-2 py-0.5 rounded-full bg-blue-950 border border-blue-500/60 text-blue-300 text-[10px] font-extrabold flex items-center gap-1">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                                                            DOCKER SERVER (HEADLESS)
                                                        </span>
                                                    ) : isMobileActive ? (
                                                        <span className="px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-500/60 text-emerald-400 text-[10px] font-extrabold flex items-center gap-1">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                                            ONLINE (Port 9222)
                                                        </span>
                                                    ) : (
                                                        <span className="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 text-[10px]">
                                                            Offline / Ready to Launch
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="text-xs text-slate-400">
                                                    {status.isDocker 
                                                        ? 'Virtual Headless Browser • Claims Daily Coins & Bonus Tasks 24/7 in Background'
                                                        : '440 x 956 Standalone Window • Contains Orange Collect Button & Bonus Tasks'}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-2">
                                            <button
                                                onClick={handleOpenPopup}
                                                className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-xs transition shadow-lg glow-gold flex items-center gap-1.5 active:scale-95">
                                                <span>📱 Open Mobile Pop-up</span>
                                            </button>
                                            {isMobileActive && (
                                                <button
                                                    onClick={handleCloseNativeMobile}
                                                    className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-900/60 text-rose-300 border border-rose-500/40 font-bold text-xs transition shadow flex items-center gap-1.5 active:scale-95 animate-pulse">
                                                    <span>🔒 Close Screen Now</span>
                                                </button>
                                            )}
                                            <button
                                                onClick={handleCollectNow}
                                                disabled={isBusy}
                                                className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition shadow-lg flex items-center gap-1.5 active:scale-95 disabled:opacity-50">
                                                <LightningIcon className="w-4 h-4 text-amber-300" />
                                                <span>Collect & Sync Now</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="pt-3 border-t border-slate-800/80 grid grid-cols-1 md:grid-cols-3 gap-3 text-xs text-slate-300">
                                        <div className="p-3 rounded-lg bg-slate-950/50 border border-slate-800/80">
                                            <div className="font-semibold text-amber-300 mb-1">1. Exact Mobile View</div>
                                            <div className="text-slate-400 text-[11px]">Bypasses PC QR codes by sending iPhone User-Agent header directly to AliExpress.</div>
                                        </div>
                                        <div className="p-3 rounded-lg bg-slate-950/50 border border-slate-800/80">
                                            <div className="font-semibold text-emerald-300 mb-1">2. Zero Hardcoding</div>
                                            <div className="text-slate-400 text-[11px]">Dynamic DOM odometer scraper extracts real-time balance and AU$ shopping savings.</div>
                                        </div>
                                        <div className="p-3 rounded-lg bg-slate-950/50 border border-slate-800/80">
                                            <div className="font-semibold text-blue-300 mb-1">3. Automated Tasks (+1, +5)</div>
                                            <div className="text-slate-400 text-[11px]">Auto-clicks quiz, sponsored explorer, and daily tasks with simulated touch pointer events.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab 2: 1-Click Bookmarklet */}
                        {activeTab === 'bookmarklet' && (
                            <div className="space-y-4">
                                <div className="p-4 rounded-xl bg-amber-500/10 border border-amber-500/20 text-slate-200 text-xs leading-relaxed">
                                    <strong className="text-amber-300">How to Collect in 1 Click (Zero Console, No Developer Tools):</strong>
                                    <ol className="list-decimal ml-5 mt-2 space-y-1.5 text-slate-300">
                                        <li>Drag the golden button below directly onto your <strong>Chrome Bookmarks Bar</strong> (or click Copy).</li>
                                        <li>Go to your AliExpress Coins tab (<code className="text-amber-400 font-mono">m.aliexpress.com/p/coin-index</code>).</li>
                                        <li>Click <strong>⭐ Collect AliExpress Coins</strong> on your Bookmarks Bar!</li>
                                        <li>It instantly clicks the Collect button, claims all bonus tasks, and automatically syncs the real live balance to this dashboard!</li>
                                    </ol>
                                </div>

                                <div className="p-5 rounded-xl bg-slate-900/80 border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400">
                                            ⭐
                                        </div>
                                        <div>
                                            <div className="text-sm font-bold text-white">Bookmarklet Tool</div>
                                            <div className="text-xs text-slate-400">Drag to Bookmarks Bar or click Copy</div>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                        {/* Draggable Bookmarklet Link */}
                                        <a
                                            href={bookmarkletSnippet}
                                            onClick={(e) => { e.preventDefault(); alert("Drag this button up to your Chrome Bookmarks Bar (or click 'Copy 1-Click Bookmarklet' to paste into a new bookmark)!"); }}
                                            title="Drag me to your Bookmarks Bar!"
                                            className="cursor-grab active:cursor-grabbing px-6 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-extrabold text-sm transition shadow-lg glow-gold flex items-center gap-2">
                                            <span>⭐ Drag Me: Collect AliExpress Coins</span>
                                        </a>

                                        <button
                                            onClick={copyBookmarkletToClipboard}
                                            className="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition border border-slate-700">
                                            <span>📋 {copyStatus}</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}


                        {/* Tab 3: Paste Cookies */}
                        {activeTab === 'paste' && (
                            <div className="space-y-4">
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    Paste your cookie string or exported JSON from AliExpress here:
                                </p>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={cookieInput}
                                        onChange={(e) => setCookieInput(e.target.value)}
                                        placeholder="Paste cookies here (e.g. aep_usuc_f=...; xman_us_t=...)"
                                        className="flex-1 px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700/80 text-white placeholder-slate-500 text-xs font-mono focus:outline-none focus:border-brand-500 transition"
                                    />
                                    <button
                                        onClick={handleConnectCookie}
                                        disabled={connectingCookie}
                                        className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold whitespace-nowrap transition disabled:opacity-50">
                                        {connectingCookie ? 'Connecting...' : 'Connect'}
                                    </button>
                                </div>
                                {cookieMsg && (
                                    <div className={`text-xs font-medium ${cookieMsg.type === 'success' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {cookieMsg.text}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Task Run History & Browser Activity Panel */}
                    <div className="glass-card rounded-2xl p-6 mb-8 border border-slate-800">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 mb-4 border-b border-slate-800 gap-2">
                            <div>
                                <h3 className="text-sm font-bold text-white flex items-center gap-2">
                                    <span>📜 Browser Activity & Task Execution History</span>
                                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-950 border border-blue-500/40 text-blue-400 font-semibold">Automated History</span>
                                </h3>
                                <p className="text-xs text-slate-400">Detailed records of when Chrome opened, what tasks were performed, and when it closed</p>
                            </div>

                            <div className="flex items-center gap-2">
                                <button
                                    onClick={fetchHistory}
                                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition border border-slate-700 flex items-center gap-1.5">
                                    <RefreshIcon className="w-3.5 h-3.5" />
                                    <span>Refresh</span>
                                </button>
                                <button
                                    onClick={handleViewRawLog}
                                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-semibold transition border border-slate-700 flex items-center gap-1.5">
                                    <span>📄 View Full Log File</span>
                                </button>
                            </div>
                        </div>

                        {/* History Cards */}
                        {history && history.length > 0 ? (
                            <div className="space-y-3">
                                {history.map(item => (
                                    <div key={item.id} className="p-4 rounded-xl bg-slate-900/80 border border-slate-800 text-xs space-y-3">
                                        <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-800/80">
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-white">{item.date}</span>
                                                <span className="text-slate-400">• Started at {item.startTime}</span>
                                                {item.durationSeconds > 0 && (
                                                    <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px]">
                                                        Duration: {item.durationSeconds}s
                                                    </span>
                                                )}
                                            </div>

                                            <div className="flex items-center gap-2 text-[11px]">
                                                <span className="text-slate-400">Balance:</span>
                                                <span className="font-mono text-emerald-400 font-bold">🪙 {item.balanceAfter || item.balanceBefore || '...'}</span>
                                                {item.worth && <span className="text-slate-400">({item.worth})</span>}
                                            </div>
                                        </div>

                                        {/* Browser Lifecycle & Tasks */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                                            <div className="p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/80">
                                                <div className="text-[10px] text-slate-400 mb-0.5">🌐 Browser Lifecycle</div>
                                                <div className="text-slate-200 text-[11px] font-semibold">
                                                    Open: <span className="text-emerald-400">{item.browserOpenedAt || '...'}</span>
                                                </div>
                                                <div className="text-slate-200 text-[11px] font-semibold">
                                                    Closed: <span className="text-rose-400">{item.browserClosedAt || '...'}</span>
                                                </div>
                                            </div>

                                            <div className="p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/80">
                                                <div className="text-[10px] text-slate-400 mb-0.5">🪙 Daily Collect</div>
                                                <div className={`text-[11px] font-semibold ${item.tasks?.dailyCollect?.status?.includes('Claimed') ? 'text-amber-400' : 'text-slate-300'}`}>
                                                    {item.tasks?.dailyCollect?.status || 'Not Checked'}
                                                </div>
                                                {item.tasks?.dailyCollect?.details && (
                                                    <div className="text-[10px] text-slate-500 mt-0.5">{item.tasks.dailyCollect.details}</div>
                                                )}
                                            </div>

                                            <div className="p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/80">
                                                <div className="text-[10px] text-slate-400 mb-0.5">🛍️ Explore Sponsored (+5)</div>
                                                <div className={`text-[11px] font-semibold ${item.tasks?.exploreSponsored?.status?.includes('Completed') ? 'text-emerald-400' : 'text-slate-400'}`}>
                                                    {item.tasks?.exploreSponsored?.status || 'Not Checked'}
                                                </div>
                                                {item.tasks?.exploreSponsored?.details && (
                                                    <div className="text-[10px] text-slate-500 mt-0.5">{item.tasks.exploreSponsored.details}</div>
                                                )}
                                            </div>

                                            <div className="p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/80">
                                                <div className="text-[10px] text-slate-400 mb-0.5">👁️ Browse Recently Viewed (+5)</div>
                                                <div className={`text-[11px] font-semibold ${item.tasks?.browseViewed?.status?.includes('Completed') ? 'text-emerald-400' : 'text-slate-400'}`}>
                                                    {item.tasks?.browseViewed?.status || 'Not Checked'}
                                                </div>
                                                {item.tasks?.browseViewed?.details && (
                                                    <div className="text-[10px] text-slate-500 mt-0.5">{item.tasks.browseViewed.details}</div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="p-6 rounded-xl bg-slate-900/50 border border-slate-800/60 text-center text-slate-400 text-xs">
                                ℹ️ No browser task sessions recorded yet. Click <strong>"⚡ Run Smart 1-Min Task Collector"</strong> above or wait for the 3-hour automated schedule to generate the first run report!
                            </div>
                        )}
                    </div>

                    {/* Raw Log Modal */}
                    {viewingRawLog && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-card max-w-3xl w-full rounded-2xl p-6 border border-slate-700 max-h-[85vh] flex flex-col">
                                <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                                    <div className="text-sm font-bold text-white flex items-center gap-2">
                                        <span>📄 collector_activity.log</span>
                                        <span className="text-xs text-slate-400">Complete Historical Log File</span>
                                    </div>
                                    <button
                                        onClick={() => setViewingRawLog(false)}
                                        className="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                        ✕
                                    </button>
                                </div>
                                <pre className="flex-1 overflow-y-auto custom-scroll p-4 rounded-xl bg-slate-950 font-mono text-[11px] text-slate-300 whitespace-pre-wrap leading-relaxed border border-slate-900">
                                    {rawLogText || 'Log file is empty.'}
                                </pre>
                                <div className="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                                    <button
                                        onClick={() => setViewingRawLog(false)}
                                        className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Live Activity Terminal / Console */}
                    <div className="glass-card rounded-2xl p-6 border border-slate-800">
                        <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                            <div className="flex items-center space-x-2">
                                <div className="w-3 h-3 rounded-full bg-rose-500/80"></div>
                                <div className="w-3 h-3 rounded-full bg-amber-500/80"></div>
                                <div className="w-3 h-3 rounded-full bg-emerald-500/80"></div>
                                <span className="ml-2 text-xs font-mono font-semibold text-slate-300">Live Console & Activity Logs</span>
                            </div>

                            <button
                                onClick={handleClearLogs}
                                className="text-[11px] text-slate-400 hover:text-slate-200 transition">
                                Clear Log
                            </button>
                        </div>

                        <div 
                            ref={logContainerRef}
                            className="h-60 overflow-y-auto custom-scroll font-mono text-xs space-y-1.5 p-3 rounded-xl bg-slate-950/80 border border-slate-900">
                            {status.logs && status.logs.length > 0 ? (
                                status.logs.map(log => {
                                    let badgeColor = 'text-blue-400';
                                    if (log.type === 'success') badgeColor = 'text-emerald-400';
                                    if (log.type === 'warn') badgeColor = 'text-amber-400';
                                    if (log.type === 'error') badgeColor = 'text-rose-400';

                                    return (
                                        <div key={log.id} className="flex items-start space-x-2 leading-relaxed">
                                             <span className="text-slate-600 select-none">[{log.time}]</span>
                                            <span className={`font-semibold select-none ${badgeColor}`}>[{log.type.toUpperCase()}]</span>
                                            <span className="text-slate-300 break-all">{log.msg}</span>
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="text-slate-600 italic py-4 text-center">No logs recorded yet. Everything is idle.</div>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="mt-8 text-center text-xs text-slate-600">
                        AliExpress Daily Coins Full-Stack Application • Running locally on Node.js & React
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
