<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AliExpress Coins Collector</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a29;
      --border: #1f2c42;
      --orange: #ff5000;
      --orange-grad: linear-gradient(135deg, #ff5000 0%, #ff8000 100%);
      --green: #10b981;
      --green-grad: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --text: #f1f5f9;
      --dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); width: 340px; padding: 16px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: #fff; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
    .badge.connected { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge.disconnected { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); margin-bottom: 4px; }
    .card-value { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: baseline; gap: 6px; }
    .card-worth { font-size: 12px; color: #f59e0b; font-weight: 600; }
    .card-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-collect { flex: 2; background: var(--orange-grad); color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(255,80,0,0.35); }
    .btn-collect:hover:not(:disabled) { opacity: 0.95; }
    .btn-collect:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-mobile { flex: 1.2; background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 12px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .btn-mobile:hover { background: #24354d; border-color: #38bdf8; }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--dim); padding: 4px 2px; }
    .toggle-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .toggle-btn.active { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #10b981; }

    .status-msg { font-size: 11px; padding: 8px; border-radius: 6px; background: #070a12; border: 1px solid #141c2c; color: #cbd5e1; margin-top: 10px; min-height: 20px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🪙</span> AliExpress Coins
    </div>
    <div id="acc-badge" class="badge connected">● Connected</div>
  </div>

  <div class="card">
    <div class="card-label">Coin Balance</div>
    <div class="card-value">
      <span id="coins-display">🪙 283</span>
      <span id="coins-worth" class="card-worth">(AU$4.26)</span>
    </div>
    <div id="acc-info" class="card-sub">Account: Linked ✓</div>
    <div id="last-updated" class="card-sub">Last collected: Today</div>
  </div>

  <div class="btn-row">
    <button id="btn-collect" class="btn-collect">
      ⚡ Collect Coins
    </button>
    <button id="btn-open-mobile" class="btn-mobile">
      📱 View Mobile
    </button>
  </div>

  <div class="toggle-row">
    <span>⏰ 24h Daily Auto-Collect</span>
    <button id="btn-toggle-auto" class="toggle-btn active">ON</button>
  </div>

  <div id="status-msg" class="status-msg">
    Ready. Click Collect to claim coins.
  </div>

  <script src="popup.js"></script>
</body>
</html>
