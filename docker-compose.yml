services:
  aliexpress-collector-v6:
    build: https://github.com/nirajtimila/aliexpress.git#main
    image: aliexpress-collector:v6
    pull_policy: build
    container_name: aliexpress-coins
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - PORT=3333
      - TZ=Australia/Sydney
